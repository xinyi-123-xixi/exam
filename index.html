<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>考试系统 - 精简测试版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .nav-tab { padding: 10px; margin: 5px; cursor: pointer; background: #eee; border: none; }
        .nav-tab.active { background: #4f6ef7; color: #fff; }
        .section { display: none; border: 1px solid #ccc; padding: 20px; margin: 10px 0; }
        .section.active { display: block; }
        .role-badge { padding: 6px 14px; border-radius: 20px; }
        .role-badge.admin { background: #fef2f2; color: #dc2626; }
        .role-badge.student { background: #f0fdf4; color: #166534; }
    </style>
</head>
<body>
    <h1>📝 考试系统测试</h1>
    <div>
        <button class="nav-tab active" data-section="exam">🖥️ 考试</button>
        <button class="nav-tab" data-section="admin">📤 管理</button>
        <button class="nav-tab" data-section="records">📊 记录</button>
        <span id="role-badge" class="role-badge student">👤 考生</span>
        <button id="toggle-btn" style="margin-left: 10px;">切换</button>
    </div>

    <div id="exam-section" class="section active">
        <h2>考试页面</h2>
        <p>试卷列表（稍后加载）</p>
    </div>
    <div id="admin-section" class="section">
        <h2>管理页面</h2>
        <p>管理员功能（上传笔记等）</p>
    </div>
    <div id="records-section" class="section">
        <h2>记录页面</h2>
        <p>考试记录（稍后加载）</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlpwtmfgjxveuswiuufl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tviG7d9Hq7Yv8W2LrokevA_NOM2nRV0';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PASS = 'admin123';
        let role = 'student';

        function setRole(r) {
            role = r;
            document.getElementById('role-badge').textContent = r === 'admin' ? '🔒 管理员' : '👤 考生';
            document.getElementById('role-badge').className = 'role-badge ' + (r === 'admin' ? 'admin' : 'student');
            // 隐藏/显示标签
            document.querySelectorAll('.nav-tab').forEach(tab => {
                const sec = tab.dataset.section;
                if (sec === 'admin' || sec === 'records') {
                    tab.style.display = r === 'admin' ? 'inline-block' : 'none';
                }
            });
            // 如果当前显示的是管理页或记录页，且是考生，则切回考试页
            if (r !== 'admin' && (document.getElementById('admin-section').classList.contains('active') || document.getElementById('records-section').classList.contains('active'))) {
                switchSection('exam');
            }
        }

        function switchSection(name) {
            ['exam', 'admin', 'records'].forEach(n => {
                document.getElementById(n + '-section').classList.remove('active');
            });
            document.getElementById(name + '-section').classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.section === name);
            });
        }

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => switchSection(tab.dataset.section));
        });

        document.getElementById('toggle-btn').addEventListener('click', () => {
            if (role === 'admin') {
                setRole('student');
            } else {
                const pwd = prompt('请输入管理员密码：');
                if (pwd === ADMIN_PASS) setRole('admin');
                else if (pwd !== null) alert('密码错误');
            }
        });

        // 测试 Supabase 连接
        (async () => {
            try {
                const { data, error } = await supabase.from('papers').select('*', { count: 'exact' });
                if (error) throw error;
                console.log('✅ Supabase 连接成功，试卷数量：', data.length);
            } catch (e) {
                console.error('❌ Supabase 连接失败：', e.message);
                alert('数据库连接失败，请检查 Supabase 设置。\n' + e.message);
            }
        })();

        // 初始状态：考生模式
        setRole('student');
    </script>
</body>
</html>
